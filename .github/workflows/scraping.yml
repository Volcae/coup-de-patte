name: Scraping refuges

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      refuge_id:
        description: 'UUID Supabase du refuge'
        required: false
        default: ''
      refuge_nom:
        description: 'Nom du refuge'
        required: true
      refuge_site:
        description: 'URL du site du refuge'
        required: true
      refuge_url_adoption:
        description: 'URL directe de la page animaux'
        required: false
        default: ''
      refuge_email:
        description: 'Email du refuge (optionnel)'
        required: false
        default: ''
      refuge_ville:
        description: 'Ville du refuge (optionnel)'
        required: false
        default: ''

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 anthropic

      - name: Run scraper universel
        timeout-minutes: 45
        env:
          ANTHROPIC_API_KEY:          ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY:  ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY:             ${{ secrets.RESEND_API_KEY }}
          REFUGE_ID:                  ${{ github.event.inputs.refuge_id }}
          REFUGE_NOM:                 ${{ github.event.inputs.refuge_nom }}
          REFUGE_SITE:                ${{ github.event.inputs.refuge_site }}
          REFUGE_URL_ADOPTION:        ${{ github.event.inputs.refuge_url_adoption }}
          REFUGE_EMAIL:               ${{ github.event.inputs.refuge_email }}
          REFUGE_VILLE:               ${{ github.event.inputs.refuge_ville }}
        run: python scraper_universel.py
