name: Scraping refuges

on:
  schedule:
    - cron: '0 6 * * 1'   # Tous les lundis à 6h du matin
  workflow_dispatch:        # Lancement manuel depuis GitHub ou le superadmin
    inputs:
      refuge_nom:
        description: 'Nom du refuge'
        required: true
      refuge_site:
        description: 'URL du site du refuge (ex: https://www.spa-messigny.fr)'
        required: true
      refuge_email:
        description: 'Email du refuge (optionnel)'
        required: false
        default: ''
      refuge_ville:
        description: 'Ville du refuge (optionnel)'
        required: false
        default: ''
      refuge_tel:
        description: 'Téléphone du refuge (optionnel)'
        required: false
        default: ''

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 anthropic

      - name: Run scraper universel
        env:
          ANTHROPIC_API_KEY:        ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL:             ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY:           ${{ secrets.RESEND_API_KEY }}
          REFUGE_NOM:               ${{ github.event.inputs.refuge_nom }}
          REFUGE_SITE:              ${{ github.event.inputs.refuge_site }}
          REFUGE_EMAIL:             ${{ github.event.inputs.refuge_email }}
          REFUGE_VILLE:             ${{ github.event.inputs.refuge_ville }}
          REFUGE_TEL:               ${{ github.event.inputs.refuge_tel }}
        run: python scraper_universel.py
