<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
<link rel="icon" type="image/x-icon" href="favicon.ico?v=2">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nouveau mot de passe · Coup de Patte</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,600;0,700;1,300;1,600&family=Nunito:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--forest:#2D4A3E;--moss:#4A7C59;--sage:#7AAD89;--mint:#C8E6C0;--mint-lt:#EBF5E8;--ivory:#F4F1E8;--paper:#FDFCF8;--border:rgba(45,74,62,0.12);--dust:#7A6E65;--smoke:#A89E96;--rose:#C9704A;}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Nunito',sans-serif;background:var(--ivory);color:var(--forest);min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:var(--paper);border-radius:28px;border:1.5px solid var(--border);box-shadow:0 16px 56px rgba(45,74,62,0.13);width:100%;max-width:440px;padding:48px 40px;margin:24px}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:32px;text-decoration:none}
.logo-bubble{width:40px;height:40px;background:var(--forest);border-radius:50% 50% 50% 50%/60% 60% 40% 40%;display:flex;align-items:center;justify-content:center}
.logo-bubble span{font-size:1rem;filter:brightness(0) invert(1)}
.logo-name{font-family:'Fraunces',serif;font-size:1.3rem;font-weight:600;color:var(--forest)}
h1{font-family:'Fraunces',serif;font-size:1.6rem;font-weight:600;font-style:italic;color:var(--forest);margin-bottom:8px}
p{font-size:0.85rem;color:var(--dust);margin-bottom:28px;line-height:1.6}
.field-group{margin-bottom:16px}
.field-label{display:block;font-size:0.78rem;font-weight:700;color:var(--forest);margin-bottom:6px}
.field-input{width:100%;padding:12px 16px;border-radius:12px;border:1.5px solid var(--border);background:var(--ivory);font-family:'Nunito',sans-serif;font-size:0.88rem;color:var(--forest);outline:none;transition:border-color 0.2s}
.field-input:focus{border-color:var(--moss)}
.pwd-wrap{position:relative}
.pwd-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:1rem;color:var(--smoke)}
.strength-bar{height:4px;border-radius:50px;background:var(--border);margin-top:6px;overflow:hidden}
.strength-fill{height:100%;border-radius:50px;transition:width 0.3s,background 0.3s;width:0%}
.strength-label{font-size:0.68rem;color:var(--smoke);margin-top:4px}
.btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--moss),var(--forest));color:var(--ivory);border:none;border-radius:50px;font-family:'Nunito',sans-serif;font-size:0.95rem;font-weight:700;cursor:pointer;margin-top:8px;transition:transform 0.2s,box-shadow 0.2s;box-shadow:0 4px 16px rgba(74,124,89,0.3)}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(74,124,89,0.4)}
.btn:disabled{opacity:0.5;cursor:not-allowed;transform:none}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--forest);color:var(--ivory);padding:12px 24px;border-radius:50px;font-size:0.85rem;font-weight:600;box-shadow:0 8px 24px rgba(45,74,62,0.25);transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1);z-index:999;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}
.success-screen{display:none;text-align:center;padding:20px 0}
.success-screen.visible{display:block}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var _supabaseClient = null;
function getSupabase() {
  if (!_supabaseClient) {
    _supabaseClient = window.supabase.createClient(
      'https://mbqsaaxaglcemdxmfvkc.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1icXNhYXhhZ2xjZW1keG1mdmtjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5MjAwMTQsImV4cCI6MjA5MzQ5NjAxNH0.lGK0LL5h-4N4DqMVy2Q_SKJgnzuy7BPQJEtSsc8plfk'
    );
  }
  return _supabaseClient;

</script>
</head>
<body>
<div class="card">
  <a href="index.html" class="logo">
    <div class="logo-bubble"><span>🐾</span></div>
    <span class="logo-name">Coup de Patte</span>
  </a>

  <!-- Formulaire -->
  <div id="formScreen">
    <h1>Nouveau mot de passe</h1>
    <p>Choisissez un mot de passe sécurisé d'au moins 8 caractères.</p>

    <div class="field-group">
      <label class="field-label">Nouveau mot de passe</label>
      <div class="pwd-wrap">
        <input class="field-input" type="password" id="pwd1" placeholder="••••••••" oninput="checkStrength(this.value)">
        <button class="pwd-toggle" type="button" onclick="togglePwd('pwd1',this)">👁</button>
      </div>
      <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
      <div class="strength-label" id="strengthLabel"></div>
    </div>

    <div class="field-group">
      <label class="field-label">Confirmer le mot de passe</label>
      <div class="pwd-wrap">
        <input class="field-input" type="password" id="pwd2" placeholder="••••••••">
        <button class="pwd-toggle" type="button" onclick="togglePwd('pwd2',this)">👁</button>
      </div>
    </div>

    <button class="btn" id="submitBtn" onclick="updatePassword()">🔒 Mettre à jour mon mot de passe</button>
  </div>

  <!-- Succès -->
  <div class="success-screen" id="successScreen">
    <div style="font-size:4rem;margin-bottom:16px">🐾</div>
    <h1>Mot de passe mis à jour !</h1>
    <p>Votre mot de passe a été changé avec succès. Vous allez être redirigé vers la connexion.</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function togglePwd(id, btn) {
  var input = document.getElementById(id);
  if (input.type === 'password') { input.type = 'text'; btn.textContent = '🙈'; }
  else { input.type = 'password'; btn.textContent = '👁'; }
}

function checkStrength(val) {
  var fill = document.getElementById('strengthFill');
  var label = document.getElementById('strengthLabel');
  if (!val) { fill.style.width = '0%'; label.textContent = ''; return; }
  var score = 0;
  if (val.length >= 8) score++;
  if (val.length >= 12) score++;
  if (/[A-Z]/.test(val)) score++;
  if (/[0-9]/.test(val)) score++;
  if (/[^A-Za-z0-9]/.test(val)) score++;
  var colors = ['#C9704A','#D4A843','#7AAD89','#4A7C59'];
  var labels = ['Trop court','Faible','Correct','Fort','Très fort'];
  fill.style.width = (score * 20) + '%';
  fill.style.background = colors[Math.min(score-1, 3)] || '#C9704A';
  label.textContent = labels[score] || '';
}

async function updatePassword() {
  var pwd1 = document.getElementById('pwd1').value;
  var pwd2 = document.getElementById('pwd2').value;

  if (pwd1.length < 8) { showToast('⚠️ Le mot de passe doit faire au moins 8 caractères'); return; }
  if (pwd1 !== pwd2) { showToast('⚠️ Les mots de passe ne correspondent pas'); return; }

  var btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = 'Mise à jour…';

  var { error } = await getSupabase().auth.updateUser({ password: pwd1 });

  if (error) {
    showToast('❌ ' + error.message);
    btn.disabled = false;
    btn.textContent = '🔒 Mettre à jour mon mot de passe';
    return;
  }

  document.getElementById('formScreen').style.display = 'none';
  document.getElementById('successScreen').classList.add('visible');
  setTimeout(() => { window.location.href = 'coup-de-patte-login.html'; }, 3000);
}

// Vérifier que l'utilisateur vient bien d'un lien de reset
window.addEventListener('load', async function() {
  var hash = window.location.hash;
  if (!hash.includes('access_token') && !hash.includes('type=recovery')) {
    var { data: { session } } = await getSupabase().auth.getSession();
    if (!session) {
      showToast('⚠️ Lien invalide ou expiré');
      setTimeout(() => { window.location.href = 'coup-de-patte-login.html'; }, 2000);
    }
  }
});
</script>
</body>
</html>
